# Site statique : pas de build. Netlify publie le dossier déposé (ou la racine
# du dépôt) tel quel — ne pas déclarer de section [build], elle fait échouer le
# glisser-déposer.

[[redirects]]
  from = "/wilfrid"
  to = "/personnes-ecoute/wilfrid-boulevard"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
