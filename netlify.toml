[build]
  publish = "."

# L'ancien site mono-praticien vivait à la racine : on renvoie vers la fiche.
[[redirects]]
  from = "/wilfrid"
  to = "/personnes-ecoute/wilfrid-boulevard"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
